name: guardian-tripwire

# Компенсирующий контроль бесплатного плана (доктрина: rtynbirf/repo-doctrine,
# глава 02 «Ветки и защита», раздел «Компенсирующий контроль»).
# Приватные репо без GitHub Pro не имеют защиты веток и secret scanning.
# Этот workflow заменяет их по принципу «не предотвратил — поднимай тревогу».
#
# Добавлен 2026-11-01 по мандату TH-GH-02.
# Удаление или правка этого файла без мандата Хозяина = нарушение доктрины
# (04-конвенции-агентов.md, §2 «Правило аддитивности»).

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tripwire:
    runs-on: ubuntu-latest
    steps:
      - name: Чек force-push в default-ветку
        env:
          FORCED: ${{ github.event.forced }}
          REF: ${{ github.ref }}
          DEFAULT: refs/heads/${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$FORCED" = "true" ] && [ "$REF" = "$DEFAULT" ]; then
            echo "::error::FORCE-PUSH в default-ветку! before=$BEFORE after=$AFTER"
            echo "alarm=force-push" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "история целая (forced=$FORCED, ref=$REF)"

      - name: Checkout (полная история)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Скан пуша на секреты
        run: |
          BEFORE="${{ github.event.before }}"
          EMPTY_TREE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$EMPTY_TREE"
          else
            BASE="$BEFORE"
          fi
          # Guard (свод III.2, урок кластера 11-06): BEFORE может оказаться
          # недостижимым объектом (переписывание истории, фантомный sha после
          # сбоев платформы). Без проверки git diff здесь либо падал, либо
          # молча пропускал скан. Проверяем достижимость базы: недостижим —
          # явный пропуск diff-скана с сообщением; это НЕ force-push и НЕ
          # повод для тревоги (пункт свода III.2).
          if [ "$BASE" != "$EMPTY_TREE" ] && ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "::warning::BEFORE=$BEFORE недостижим в этой истории — diff-скан секретов ПРОПУЩЕН (не force-push, не секрет)"
            exit 0
          fi
          echo "сканирую дифф $BASE..${{ github.sha }}"
          if git diff "$BASE" "${{ github.sha }}" -- . ':!.github/workflows/guardian-tripwire.yml' \
             | grep -anE 'github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'; then
            echo "::error::ПОХОЖЕ НА СЕКРЕТ В ПУШЕ — см. строки выше"
            exit 1
          fi
          echo "секретов в пуше не найдено"

      - name: ALARM — открыть issue
        if: failure()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.1.0 # v9.0.0
        with:
          script: |
            const kind = '${{ github.event.forced }}' === 'true' ? 'FORCE-PUSH' : 'СЕКРЕТ В ПУШЕ';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'TRIPWIRE: ' + kind + ' — ' + context.sha.slice(0, 7),
              body: 'Кто: ' + (context.actor || 'неизвестно') +
                    '\nSHA: ' + context.sha +
                    '\nbefore: ' + (context.payload.before || '-') +
                    '\nВетка: ' + context.ref +
                    '\n\nРазбор — по доктрине 05-аварийные-процедуры.md (§3). Журнал прогона: ' +
                    context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
                    '/actions/runs/' + context.runId
            });
